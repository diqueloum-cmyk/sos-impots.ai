<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - sos-impots.ai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'system-ui', sans-serif; }
    .tab-button {
      transition: color 0.3s ease, border-color 0.3s ease;
    }
    .tab-button.active {
      color: #1e3a8a;
      border-bottom-color: #1e3a8a;
    }
    .tab-content.hidden {
      display: none;
    }
    .sub-tab-button {
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .sub-tab-button.active {
      background-color: #2563eb;
      color: white;
    }
    .view-content.hidden {
      display: none;
    }
  </style>
</head>
<body class="bg-gray-100">

  <!-- Modal de connexion admin -->
  <div id="authModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-8 max-w-md w-full mx-4">
      <h2 class="text-2xl font-bold text-blue-900 mb-6">Authentification Admin</h2>
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Clé Admin</label>
          <input
            type="password"
            id="adminKeyInput"
            required
            placeholder="Entrez votre clé admin"
            class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div id="loginError" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded"></div>
        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition-colors">
          Se connecter
        </button>
      </form>
    </div>
  </div>

  <!-- Contenu admin (caché par défaut) -->
  <div id="adminContent" class="hidden">
    <div class="container mx-auto px-4 py-8">
      <div class="bg-white rounded-lg shadow-lg p-6">
        <div class="flex justify-between items-center mb-6">
          <h1 class="text-3xl font-bold text-blue-900">Administration - sos-impots.ai</h1>
          <button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
            Déconnexion
          </button>
        </div>

        <!-- Onglets -->
        <div class="mb-8">
          <div class="flex border-b border-gray-300">
            <button id="tabStats" class="tab-button active px-6 py-3 font-semibold text-blue-900 border-b-2 border-blue-900">
              Statistiques
            </button>
            <button id="tabConversations" class="tab-button px-6 py-3 font-semibold text-gray-600 hover:text-blue-900">
              Conversations
            </button>
          </div>
        </div>

        <!-- Contenu Onglet Statistiques -->
        <div id="contentStats" class="tab-content">

      <!-- Statistiques -->
      <div class="grid md:grid-cols-4 gap-6 mb-8">
        <div class="bg-blue-50 p-4 rounded-lg">
          <h3 class="text-lg font-semibold text-blue-900">Total Sessions</h3>
          <p id="totalSessions" class="text-2xl font-bold text-blue-600">-</p>
        </div>
        <div class="bg-green-50 p-4 rounded-lg">
          <h3 class="text-lg font-semibold text-green-900">Sessions Aujourd'hui</h3>
          <p id="todaySessions" class="text-2xl font-bold text-green-600">-</p>
        </div>
        <div class="bg-purple-50 p-4 rounded-lg">
          <h3 class="text-lg font-semibold text-purple-900">Total Messages</h3>
          <p id="totalMessages" class="text-2xl font-bold text-purple-600">-</p>
        </div>
        <div class="bg-orange-50 p-4 rounded-lg">
          <h3 class="text-lg font-semibold text-orange-900">Sessions récentes</h3>
          <p id="recentSessions" class="text-2xl font-bold text-orange-600">-</p>
        </div>
      </div>

      <!-- Bouton de rafraîchissement -->
      <div class="mb-6">
        <button onclick="loadStats()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
          Actualiser les données
        </button>
      </div>

      <!-- Messages d'erreur -->
      <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>

        </div>
        <!-- Fin Contenu Onglet Statistiques -->

        <!-- Contenu Onglet Conversations -->
        <div id="contentConversations" class="tab-content hidden">
          <!-- Sous-onglets -->
          <div class="mb-6">
            <div class="flex gap-4 mb-4">
              <button id="viewAll" class="sub-tab-button active px-4 py-2 bg-blue-600 text-white rounded">
                Toutes les conversations
              </button>
              <button id="viewAnonymous" class="sub-tab-button px-4 py-2 bg-gray-300 text-gray-700 rounded">
                Conversations anonymes
              </button>
            </div>

            <!-- Filtres -->
            <div class="flex gap-4 mb-6">
              <select id="dateFilter" class="border rounded px-4 py-2">
                <option value="">Toutes les dates</option>
                <option value="7d">7 derniers jours</option>
                <option value="30d">30 derniers jours</option>
              </select>

              <button onclick="exportConversations()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                Exporter CSV
              </button>

              <button onclick="cleanupOldSessions()" class="bg-orange-600 text-white px-4 py-2 rounded hover:bg-orange-700">
                Nettoyer (+30j)
              </button>
            </div>
          </div>

          <!-- Vue Toutes les Conversations -->
          <div id="viewAllContent" class="view-content">
            <div id="conversationsList" class="space-y-4">
              <!-- Liste des conversations -->
            </div>

            <!-- Pagination -->
            <div id="pagination" class="flex justify-center gap-2 mt-6">
              <!-- Boutons de pagination -->
            </div>
          </div>

          <!-- Vue Conversations Anonymes -->
          <div id="viewAnonymousContent" class="view-content hidden">
            <div class="overflow-x-auto">
              <table class="min-w-full divide-y divide-gray-200 bg-white shadow rounded-lg">
                <thead class="bg-gray-50">
                  <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Identifiant</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">IP</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Navigateur</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Titre</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Messages</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                  </tr>
                </thead>
                <tbody id="anonymousConversationsList" class="bg-white divide-y divide-gray-200">
                  <!-- Les conversations seront insérées ici dynamiquement -->
                </tbody>
              </table>
            </div>

            <!-- Pagination -->
            <div id="anonymousPagination" class="mt-4 flex justify-center gap-2">
              <!-- Boutons de pagination seront insérés ici -->
            </div>
          </div>

          <!-- Modal Détail Conversation -->
          <div id="conversationModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 overflow-y-auto">
            <div class="flex justify-center min-h-screen p-4">
              <div class="bg-white rounded-lg max-w-4xl w-full my-auto p-8">
                <div class="flex justify-between items-center mb-6">
                  <h2 id="modalTitle" class="text-2xl font-bold text-blue-900"></h2>
                  <button onclick="closeConversationModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
                </div>

                <div id="modalContent" class="space-y-4 max-h-96 overflow-y-auto">
                  <!-- Messages Q&A -->
                </div>

                <div class="mt-6 flex gap-4">
                  <button onclick="deleteConversation()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
                    Supprimer
                  </button>
                  <button onclick="closeConversationModal()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">
                    Fermer
                  </button>
                </div>
              </div>
            </div>
          </div>

        </div>
        <!-- Fin Contenu Onglet Conversations -->

      </div>
    </div>
  </div>

  <script>
    let adminKey = null;

    // Vérifier si déjà connecté au chargement
    document.addEventListener('DOMContentLoaded', function() {
      const savedKey = sessionStorage.getItem('adminKey');
      if (savedKey) {
        adminKey = savedKey;
        testAdminKey(savedKey);
      }
    });

    async function handleLogin(event) {
      event.preventDefault();
      const testKey = document.getElementById('adminKeyInput').value;

      try {
        const response = await fetch('/api/admin-conversations?action=stats', {
          headers: { 'X-Admin-Key': testKey }
        });

        const data = await response.json();

        if (response.ok && data.success) {
          adminKey = testKey;
          sessionStorage.setItem('adminKey', testKey);
          showAdminContent();
          loadStats();
        } else {
          throw new Error('Clé admin invalide');
        }
      } catch (error) {
        const errorDiv = document.getElementById('loginError');
        errorDiv.textContent = 'Clé admin invalide. Veuillez réessayer.';
        errorDiv.classList.remove('hidden');
      }
    }

    async function testAdminKey(key) {
      try {
        const response = await fetch('/api/admin-conversations?action=stats', {
          headers: { 'X-Admin-Key': key }
        });

        if (response.ok) {
          showAdminContent();
          loadStats();
        } else {
          sessionStorage.removeItem('adminKey');
          adminKey = null;
        }
      } catch (error) {
        sessionStorage.removeItem('adminKey');
        adminKey = null;
      }
    }

    function showAdminContent() {
      document.getElementById('authModal').classList.add('hidden');
      document.getElementById('adminContent').classList.remove('hidden');
    }

    function logout() {
      adminKey = null;
      sessionStorage.removeItem('adminKey');
      document.getElementById('authModal').classList.remove('hidden');
      document.getElementById('adminContent').classList.add('hidden');
      document.getElementById('adminKeyInput').value = '';
    }

    async function loadStats() {
      if (!adminKey) return;

      try {
        const dateFilter = document.getElementById('dateFilter')?.value || '';
        const url = `/api/admin-conversations?action=stats${dateFilter ? '&dateFilter=' + dateFilter : ''}`;

        const response = await fetch(url, {
          headers: { 'X-Admin-Key': adminKey }
        });

        if (response.status === 403) {
          logout();
          throw new Error('Session expirée. Veuillez vous reconnecter.');
        }

        const data = await response.json();

        if (data.success) {
          document.getElementById('totalSessions').textContent = data.stats.totalSessions;
          document.getElementById('todaySessions').textContent = data.stats.todaySessions;
          document.getElementById('totalMessages').textContent = data.stats.totalMessages;
          document.getElementById('recentSessions').textContent = data.stats.recentSessions;
        } else {
          throw new Error(data.error || 'Erreur lors du chargement des statistiques');
        }
      } catch (error) {
        showError('Erreur: ' + error.message);
      }
    }

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.classList.remove('hidden');

      setTimeout(() => {
        errorDiv.classList.add('hidden');
      }, 5000);
    }

    // ========================================
    // GESTION DES CONVERSATIONS
    // ========================================

    let currentPage = 1;
    let currentDateFilter = '';
    let currentSessionId = null;
    let currentAnonymousPage = 1;

    // Gestion des onglets principaux
    document.getElementById('tabStats').addEventListener('click', () => {
      switchTab('Stats');
    });

    document.getElementById('tabConversations').addEventListener('click', () => {
      switchTab('Conversations');
      loadAllConversations();
    });

    function switchTab(tab) {
      document.querySelectorAll('.tab-button').forEach(btn => {
        btn.classList.remove('active', 'border-b-2', 'border-blue-900', 'text-blue-900');
        btn.classList.add('text-gray-600');
      });
      document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));

      const selectedTab = document.getElementById(`tab${tab}`);
      selectedTab.classList.add('active', 'border-b-2', 'border-blue-900', 'text-blue-900');
      selectedTab.classList.remove('text-gray-600');
      document.getElementById(`content${tab}`).classList.remove('hidden');
    }

    // Gestion des sous-onglets
    document.getElementById('viewAll').addEventListener('click', () => {
      switchView('All');
      loadAllConversations();
    });

    document.getElementById('viewAnonymous').addEventListener('click', () => {
      switchView('Anonymous');
      loadAnonymousConversations(1);
    });

    function switchView(view) {
      document.querySelectorAll('.sub-tab-button').forEach(btn => {
        btn.classList.remove('active', 'bg-blue-600', 'text-white');
        btn.classList.add('bg-gray-300', 'text-gray-700');
      });

      document.querySelectorAll('.view-content').forEach(content => content.classList.add('hidden'));

      if (view === 'All') {
        const btn = document.getElementById('viewAll');
        btn.classList.add('active', 'bg-blue-600', 'text-white');
        btn.classList.remove('bg-gray-300', 'text-gray-700');
        document.getElementById('viewAllContent').classList.remove('hidden');
      } else if (view === 'Anonymous') {
        const btn = document.getElementById('viewAnonymous');
        btn.classList.add('active', 'bg-blue-600', 'text-white');
        btn.classList.remove('bg-gray-300', 'text-gray-700');
        document.getElementById('viewAnonymousContent').classList.remove('hidden');
      }
    }

    async function loadAllConversations() {
      if (!adminKey) return;

      currentDateFilter = document.getElementById('dateFilter').value;

      let url = `/api/admin-conversations?action=list&page=${currentPage}&limit=50`;
      if (currentDateFilter) url += `&dateFilter=${currentDateFilter}`;

      try {
        const response = await fetch(url, {
          headers: { 'X-Admin-Key': adminKey }
        });
        const data = await response.json();

        const list = document.getElementById('conversationsList');
        list.innerHTML = '';

        if (!data.sessions || data.sessions.length === 0) {
          const emptyP = document.createElement('p');
          emptyP.className = 'text-gray-500';
          emptyP.textContent = 'Aucune conversation trouvée';
          list.appendChild(emptyP);
          return;
        }

        data.sessions.forEach(session => {
          const card = document.createElement('div');
          card.className = 'bg-white p-4 rounded-lg shadow cursor-pointer hover:shadow-lg transition';
          card.onclick = () => showConversation(session.id, session.title);

          const flexDiv = document.createElement('div');
          flexDiv.className = 'flex justify-between items-start';

          const contentDiv = document.createElement('div');
          contentDiv.className = 'flex-1';

          const titleH3 = document.createElement('h3');
          titleH3.className = 'font-bold text-lg text-blue-900';
          titleH3.textContent = session.title;

          const idP = document.createElement('p');
          idP.className = 'text-gray-600 text-sm';
          const idShort = session.anonymous_identifier
            ? session.anonymous_identifier.substring(0, 8) + '...'
            : 'Session #' + session.id;
          idP.textContent = idShort;

          const dateP = document.createElement('p');
          dateP.className = 'text-gray-500 text-sm mt-2';
          dateP.textContent = `${new Date(session.started_at).toLocaleDateString('fr-FR')} - ${session.message_count} message(s)`;

          contentDiv.appendChild(titleH3);
          contentDiv.appendChild(idP);
          contentDiv.appendChild(dateP);
          flexDiv.appendChild(contentDiv);
          card.appendChild(flexDiv);
          list.appendChild(card);
        });

        renderPagination(data.page, data.pages);
      } catch (error) {
        showError('Erreur lors du chargement des conversations: ' + error.message);
      }
    }

    function renderPagination(page, totalPages) {
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';

      if (totalPages <= 1) return;

      if (page > 1) {
        const prev = document.createElement('button');
        prev.textContent = '\u2190 Pr\u00e9c\u00e9dent';
        prev.className = 'px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700';
        prev.onclick = () => {
          currentPage--;
          loadAllConversations();
        };
        pagination.appendChild(prev);
      }

      for (let i = 1; i <= totalPages; i++) {
        if (i === page || i === 1 || i === totalPages || Math.abs(i - page) <= 2) {
          const pageBtn = document.createElement('button');
          pageBtn.textContent = i;
          pageBtn.className = i === page
            ? 'px-4 py-2 bg-blue-900 text-white rounded'
            : 'px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400';
          pageBtn.onclick = () => {
            currentPage = i;
            loadAllConversations();
          };
          pagination.appendChild(pageBtn);
        } else if (Math.abs(i - page) === 3) {
          const dots = document.createElement('span');
          dots.textContent = '...';
          dots.className = 'px-2';
          pagination.appendChild(dots);
        }
      }

      if (page < totalPages) {
        const next = document.createElement('button');
        next.textContent = 'Suivant \u2192';
        next.className = 'px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700';
        next.onclick = () => {
          currentPage++;
          loadAllConversations();
        };
        pagination.appendChild(next);
      }
    }

    async function showConversation(sessionId, title) {
      if (!adminKey) return;

      currentSessionId = sessionId;

      try {
        const response = await fetch(`/api/admin-conversations?action=messages&sessionId=${sessionId}`, {
          headers: { 'X-Admin-Key': adminKey }
        });
        const data = await response.json();

        document.getElementById('modalTitle').textContent = title;
        const content = document.getElementById('modalContent');
        content.innerHTML = '';

        if (!data.messages || data.messages.length === 0) {
          const emptyP = document.createElement('p');
          emptyP.className = 'text-gray-500';
          emptyP.textContent = 'Aucun message dans cette conversation';
          content.appendChild(emptyP);
        } else {
          data.messages.forEach(msg => {
            const msgDiv = document.createElement('div');
            msgDiv.className = msg.role === 'user'
              ? 'bg-blue-50 p-4 rounded-lg'
              : 'bg-gray-50 p-4 rounded-lg';

            const roleDiv = document.createElement('div');
            roleDiv.className = `font-bold text-sm mb-2 ${msg.role === 'user' ? 'text-blue-900' : 'text-gray-700'}`;
            roleDiv.textContent = msg.role === 'user' ? 'Question' : 'R\u00e9ponse';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'text-gray-800 whitespace-pre-line';
            contentDiv.textContent = msg.content;

            const dateDiv = document.createElement('div');
            dateDiv.className = 'text-xs text-gray-500 mt-2';
            dateDiv.textContent = new Date(msg.created_at).toLocaleString('fr-FR');

            msgDiv.appendChild(roleDiv);
            msgDiv.appendChild(contentDiv);
            msgDiv.appendChild(dateDiv);
            content.appendChild(msgDiv);
          });
        }

        document.getElementById('conversationModal').classList.remove('hidden');
      } catch (error) {
        showError('Erreur lors du chargement de la conversation: ' + error.message);
      }
    }

    function closeConversationModal() {
      document.getElementById('conversationModal').classList.add('hidden');
      currentSessionId = null;
    }

    async function deleteConversation() {
      if (!currentSessionId || !adminKey) return;

      if (!confirm('\u00cates-vous s\u00fbr de vouloir supprimer cette conversation ?')) return;

      try {
        await fetch(`/api/admin-conversations?sessionId=${currentSessionId}`, {
          method: 'DELETE',
          headers: { 'X-Admin-Key': adminKey }
        });

        closeConversationModal();
        loadAllConversations();
      } catch (error) {
        showError('Erreur lors de la suppression: ' + error.message);
      }
    }

    async function exportConversations() {
      if (!adminKey) return;

      const dateFilter = document.getElementById('dateFilter').value;
      // Passer la clé admin dans le header via un lien temporaire
      try {
        const response = await fetch(`/api/admin-conversations?action=export&dateFilter=${dateFilter}`, {
          headers: { 'X-Admin-Key': adminKey }
        });

        if (!response.ok) {
          throw new Error('Erreur export');
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `conversations-${dateFilter || 'all'}-${Date.now()}.csv`;
        a.click();
        window.URL.revokeObjectURL(url);
      } catch (error) {
        showError('Erreur export: ' + error.message);
      }
    }

    async function cleanupOldSessions() {
      if (!adminKey) return;
      if (!confirm('Supprimer les sessions anonymes de plus de 30 jours ?')) return;

      try {
        const response = await fetch('/api/admin-conversations?action=cleanup', {
          headers: { 'X-Admin-Key': adminKey }
        });
        const data = await response.json();

        if (data.success) {
          alert(`${data.deleted} session(s) supprim\u00e9e(s)`);
          loadAllConversations();
        } else {
          showError('Erreur: ' + data.error);
        }
      } catch (error) {
        showError('Erreur nettoyage: ' + error.message);
      }
    }

    // Event listeners pour les filtres
    document.getElementById('dateFilter').addEventListener('change', () => {
      currentPage = 1;
      loadAllConversations();
    });

    // ====================================
    // GESTION DES CONVERSATIONS ANONYMES
    // ====================================

    async function loadAnonymousConversations(page = 1) {
      if (!adminKey) return;

      currentAnonymousPage = page;
      const dateFilter = document.getElementById('dateFilter').value;

      try {
        const response = await fetch(
          `/api/admin-conversations?action=listAnonymous&page=${page}&limit=50&dateFilter=${dateFilter}`,
          {
            headers: { 'X-Admin-Key': adminKey }
          }
        );

        const data = await response.json();

        if (data.success) {
          renderAnonymousConversations(data.conversations);
          renderAnonymousPagination(data.pagination);
        } else {
          showError('Erreur: ' + data.error);
        }
      } catch (error) {
        console.error('Erreur chargement conversations anonymes:', error);
        showError('Erreur chargement conversations');
      }
    }

    function parseUserAgent(ua) {
      if (!ua || ua === 'Unknown') return 'Inconnu';

      if (ua.includes('Chrome') && !ua.includes('Edg')) return 'Chrome';
      if (ua.includes('Safari') && !ua.includes('Chrome')) return 'Safari';
      if (ua.includes('Firefox')) return 'Firefox';
      if (ua.includes('Edg')) return 'Edge';
      if (ua.includes('Opera') || ua.includes('OPR')) return 'Opera';

      return 'Autre';
    }

    function maskIP(ip) {
      if (!ip) return 'N/A';
      const parts = ip.split('.');
      if (parts.length === 4) {
        return `${parts[0]}.${parts[1]}.${parts[2]}.***`;
      }
      return ip.substring(0, 15) + '...';
    }

    function renderAnonymousConversations(conversations) {
      const tbody = document.getElementById('anonymousConversationsList');
      tbody.innerHTML = '';

      if (!conversations || conversations.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 8;
        td.className = 'px-6 py-4 text-center text-gray-500';
        td.textContent = 'Aucune conversation anonyme trouvée';
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
      }

      conversations.forEach(conv => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-gray-50';

        const idTd = document.createElement('td');
        idTd.className = 'px-6 py-4 whitespace-nowrap text-sm text-gray-900';
        idTd.textContent = conv.id;

        const anonTd = document.createElement('td');
        anonTd.className = 'px-6 py-4 whitespace-nowrap text-sm text-gray-600 font-mono';
        anonTd.textContent = conv.anonymous_identifier
          ? conv.anonymous_identifier.substring(0, 8) + '...'
          : 'N/A';

        const ipTd = document.createElement('td');
        ipTd.className = 'px-6 py-4 whitespace-nowrap text-sm text-gray-600';
        ipTd.textContent = maskIP(conv.ip_address);

        const browserTd = document.createElement('td');
        browserTd.className = 'px-6 py-4 whitespace-nowrap text-sm text-gray-600';
        browserTd.textContent = parseUserAgent(conv.user_agent);

        const titleTd = document.createElement('td');
        titleTd.className = 'px-6 py-4 text-sm text-gray-900 max-w-xs truncate';
        titleTd.textContent = conv.title || 'Sans titre';

        const msgTd = document.createElement('td');
        msgTd.className = 'px-6 py-4 whitespace-nowrap text-sm text-gray-600';
        msgTd.textContent = conv.message_count;

        const dateTd = document.createElement('td');
        dateTd.className = 'px-6 py-4 whitespace-nowrap text-sm text-gray-600';
        const date = new Date(conv.started_at).toLocaleDateString('fr-FR');
        const time = new Date(conv.started_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        dateTd.textContent = `${date} ${time}`;

        const actionsTd = document.createElement('td');
        actionsTd.className = 'px-6 py-4 whitespace-nowrap text-sm font-medium';

        const viewBtn = document.createElement('button');
        viewBtn.className = 'text-blue-600 hover:text-blue-900 mr-3';
        viewBtn.textContent = 'Voir';
        viewBtn.onclick = () => showConversation(conv.id, conv.title || 'Sans titre');

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'text-red-600 hover:text-red-900';
        deleteBtn.textContent = 'Supprimer';
        deleteBtn.onclick = () => deleteAnonymousConversation(conv.id);

        actionsTd.appendChild(viewBtn);
        actionsTd.appendChild(deleteBtn);

        tr.appendChild(idTd);
        tr.appendChild(anonTd);
        tr.appendChild(ipTd);
        tr.appendChild(browserTd);
        tr.appendChild(titleTd);
        tr.appendChild(msgTd);
        tr.appendChild(dateTd);
        tr.appendChild(actionsTd);

        tbody.appendChild(tr);
      });
    }

    function renderAnonymousPagination(pagination) {
      const container = document.getElementById('anonymousPagination');
      container.innerHTML = '';

      if (pagination.totalPages <= 1) return;

      const { page, totalPages } = pagination;

      if (page > 1) {
        const prev = document.createElement('button');
        prev.textContent = '\u2190 Pr\u00e9c\u00e9dent';
        prev.className = 'px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700';
        prev.onclick = () => loadAnonymousConversations(page - 1);
        container.appendChild(prev);
      }

      for (let i = 1; i <= totalPages; i++) {
        if (i === page || i === 1 || i === totalPages || Math.abs(i - page) <= 2) {
          const btn = document.createElement('button');
          btn.textContent = i;
          btn.className = i === page
            ? 'px-4 py-2 bg-blue-900 text-white rounded'
            : 'px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400';
          if (i !== page) {
            btn.onclick = () => loadAnonymousConversations(i);
          }
          container.appendChild(btn);
        } else if (Math.abs(i - page) === 3) {
          const dots = document.createElement('span');
          dots.textContent = '...';
          dots.className = 'px-2';
          container.appendChild(dots);
        }
      }

      if (page < totalPages) {
        const next = document.createElement('button');
        next.textContent = 'Suivant \u2192';
        next.className = 'px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700';
        next.onclick = () => loadAnonymousConversations(page + 1);
        container.appendChild(next);
      }
    }

    async function deleteAnonymousConversation(sessionId) {
      if (!adminKey) return;

      if (!confirm('\u00cates-vous s\u00fbr de vouloir supprimer cette conversation anonyme ?')) {
        return;
      }

      try {
        const response = await fetch(`/api/admin-conversations?sessionId=${sessionId}`, {
          method: 'DELETE',
          headers: { 'X-Admin-Key': adminKey }
        });

        const data = await response.json();

        if (data.success) {
          loadAnonymousConversations(currentAnonymousPage);
        } else {
          showError('Erreur lors de la suppression: ' + data.error);
        }
      } catch (error) {
        console.error('Erreur suppression conversation anonyme:', error);
        showError('Erreur lors de la suppression: ' + error.message);
      }
    }
  </script>
</body>
</html>
