<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Chat — SOS-IMPOTS.AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f4f4f5; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    #app { width: 100%; max-width: 720px; height: 90vh; display: flex; flex-direction: column; background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.1); overflow: hidden; }

    #header { padding: 16px 20px; background: #1e3a5f; color: #fff; display: flex; align-items: center; gap: 10px; }
    #header h1 { font-size: 16px; font-weight: 600; }
    #status { font-size: 12px; color: #93c5fd; margin-left: auto; }

    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }

    .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .msg.user { background: #1e3a5f; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.assistant { background: #f1f5f9; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg.system-msg { background: #fef9c3; color: #713f12; align-self: center; font-size: 12px; border-radius: 6px; padding: 8px 14px; }

    #payment-banner { display: none; background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px; padding: 14px 16px; margin: 0 20px 12px; font-size: 14px; color: #166534; }
    #payment-banner a { color: #15803d; font-weight: 600; text-decoration: underline; }

    #typing { display: none; align-self: flex-start; background: #f1f5f9; border-radius: 12px; padding: 12px 16px; }
    #typing span { display: inline-block; width: 8px; height: 8px; background: #94a3b8; border-radius: 50%; margin: 0 2px; animation: bounce 1.2s infinite; }
    #typing span:nth-child(2) { animation-delay: .2s; }
    #typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    #input-area { padding: 16px 20px; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; }
    #input { flex: 1; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 14px; font-size: 14px; resize: none; outline: none; font-family: inherit; line-height: 1.4; max-height: 120px; }
    #input:focus { border-color: #1e3a5f; }
    #send { background: #1e3a5f; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer; font-weight: 600; white-space: nowrap; }
    #send:disabled { background: #94a3b8; cursor: not-allowed; }

    #debug { margin: 12px 20px; padding: 10px 14px; background: #1e1e2e; color: #a6e3a1; border-radius: 8px; font-family: monospace; font-size: 12px; max-height: 120px; overflow-y: auto; display: none; }
    #debug-toggle { font-size: 11px; color: #64748b; cursor: pointer; text-align: right; padding: 4px 20px; text-decoration: underline; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <h1>Test Agent Fiscal — SOS-IMPOTS.AI</h1>
    <span id="status">En ligne</span>
  </div>

  <div id="messages">
    <div class="msg system-msg">Page de test — appelle /api/chat en backend</div>
  </div>

  <div id="typing"><span></span><span></span><span></span></div>

  <div id="payment-banner">
    Offre sélectionnée : <strong id="offre-label"></strong> —
    <a id="payment-link" href="#" target="_blank">Procéder au paiement →</a>
  </div>

  <span id="debug-toggle" onclick="toggleDebug()">Afficher debug</span>
  <div id="debug"></div>

  <div id="input-area">
    <textarea id="input" rows="1" placeholder="Posez votre question fiscale…"></textarea>
    <button id="send" onclick="sendMessage()">Envoyer</button>
  </div>
</div>

<script>
  let sessionId = null;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const typingEl = document.getElementById('typing');
  const debugEl = document.getElementById('debug');
  const paymentBanner = document.getElementById('payment-banner');

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  // Envoyer avec Entrée (Shift+Entrée = saut de ligne)
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function log(data) {
    debugEl.textContent += JSON.stringify(data, null, 2) + '\n---\n';
    debugEl.scrollTop = debugEl.scrollHeight;
  }

  function toggleDebug() {
    const visible = debugEl.style.display === 'block';
    debugEl.style.display = visible ? 'none' : 'block';
    document.getElementById('debug-toggle').textContent = visible ? 'Afficher debug' : 'Masquer debug';
  }

  async function sendMessage() {
    const message = inputEl.value.trim();
    if (!message) return;

    addMessage('user', message);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    typingEl.style.display = 'block';
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const body = { message };
      if (sessionId) body.sessionId = sessionId;

      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      log({ status: res.status, ...data });

      if (!res.ok) {
        addMessage('system-msg', '❌ Erreur ' + res.status + ' : ' + (data.error || 'inconnue'));
        return;
      }

      if (data.sessionId) sessionId = data.sessionId;

      addMessage('assistant', data.response);

      // Afficher la bannière de paiement si une offre a été choisie
      if (data.paymentUrl) {
        document.getElementById('offre-label').textContent = data.offreChoisie || 'offre';
        document.getElementById('payment-link').href = data.paymentUrl;
        paymentBanner.style.display = 'block';
      }

      if (data.cached) {
        const tag = document.createElement('div');
        tag.className = 'msg system-msg';
        tag.textContent = '⚡ Réponse servie depuis le cache';
        messagesEl.appendChild(tag);
      }

    } catch (err) {
      addMessage('system-msg', '❌ Erreur réseau : ' + err.message);
      log({ error: err.message });
    } finally {
      typingEl.style.display = 'none';
      sendBtn.disabled = false;
      inputEl.focus();
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }
</script>
</body>
</html>
