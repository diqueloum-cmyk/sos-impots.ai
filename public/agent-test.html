async function startWithKey() {
  const key = document.getElementById('key-input').value.trim();
  if (!key.startsWith('sk-ant-')) {
    showKeyError('Format invalide. La clé doit commencer par sk-ant-');
    return;
  }
  document.getElementById('key-btn').disabled = true;
  document.getElementById('key-btn').textContent = 'Vérification…';

  // Test rapide
  try {
    const r = await callClaude(key, [{ role: 'user', content: 'ping' }], 10);
    if (r.error) throw new Error(r.error.message || 'Erreur API');
  } catch (e) {
    showKeyError('Clé invalide : ' + e.message);
    document.getElementById('key-btn').disabled = false;
    document.getElementById('key-btn').textContent = 'Démarrer';
    return;
  }

  apiKey = key;
  document.getElementById('key-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  inputEl.focus();
}

function showKeyError(msg) {
  const el = document.getElementById('key-error');
  el.textContent = msg;
  el.style.display = 'block';
}

async function callClaude(key, messages, maxTokens = 1500) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'content-type': 'application/json'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: maxTokens,
      temperature: 0,
      system: SYSTEM_PROMPT,
      messages
    })
  });
  return res.json();
}

  const idx = display.indexOf('---INTERNAL---');
  if (idx !== -1) {
    const json = display.substring(idx + '---INTERNAL---'.length).trim();
    display = display.substring(0, idx).trim();
    try { return { display, internal: JSON.parse(json) }; } catch {}
  }
  return { display, internal: null };
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendMessage() {
  const message = inputEl.value.trim();
  if (!message) return;

  addMessage('user', message);
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;
  typingEl.style.display = 'block';
  messagesEl.scrollTop = messagesEl.scrollHeight;

  history.push({ role: 'user', content: message });

  try {
    const data = await callClaude(apiKey, history);

    if (data.error) {
      addMessage('system-msg', '❌ Erreur API : ' + (data.error.message || JSON.stringify(data.error)));
      history.pop();
      return;
    }

    const fullText = data.content[0].text;
    history.push({ role: 'assistant', content: fullText });

    const { display, internal } = parseResponse(fullText);
    addMessage('assistant', display);

    // Détection de l'offre : via bloc INTERNAL ou fallback par mots-clés de confirmation
    let offreKey = internal?.offre_choisie || null;
    if (!offreKey || !STRIPE_LINKS[offreKey]) {
      const isConfirmation = display.includes('Merci pour votre commande') || display.includes('Analyse Express IA (39') || display.includes('Analyse Premium');
      if (isConfirmation) {
        if (display.includes('Express') && display.includes('39')) offreKey = 'express_39';
        else if (display.includes('Premium') && display.includes('99')) offreKey = 'premium_99';
      }
    }
    if (offreKey && STRIPE_LINKS[offreKey]) {
      const labels = { express_39: 'Analyse Express IA — 39 €', premium_99: 'Analyse Premium — 99 €' };
      document.getElementById('offre-label').textContent = labels[offreKey] || offreKey;
      document.getElementById('payment-link').href = STRIPE_LINKS[offreKey];
      paymentBanner.style.display = 'block';
    }

  } catch (err) {
    addMessage('system-msg', '❌ Erreur réseau : ' + err.message);
    history.pop();
  } finally {
    typingEl.style.display = 'none';
    sendBtn.disabled = false;
    inputEl.focus();
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

function resetConversation() {
  history = [];
  messagesEl.innerHTML = '';
  paymentBanner.style.display = 'none';
  inputEl.focus();
}
</script>
